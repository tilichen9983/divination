<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>象棋占卜・五子解惑</title>

  <style>
    :root {
      --bg: #f8f7f3;
      --paper: #ffffff;
      --ink: #756d62;
      --muted: #9c958b;
      --gold: #c7a45f;
      --gold-light: #ead9ac;
      --line: #ded8cc;
      --shadow: rgba(91, 78, 57, 0.16);
      --red: #b75c55;
      --black: #59626a;
      --cover: #e9e6df;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif;
      background:
        radial-gradient(circle at 50% 0%, #fffdf8 0%, transparent 38%),
        var(--bg);
    }

    .app {
      width: min(980px, calc(100% - 30px));
      margin: 0 auto;
      padding: 38px 0 70px;
    }

    header {
      text-align: center;
    }

    h1 {
      margin: 0;
      color: #8b7651;
      font-size: clamp(26px, 4vw, 36px);
      letter-spacing: 0.12em;
    }

    .subtitle {
      margin: 12px auto 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.8;
    }

    .question-panel {
      width: min(700px, 100%);
      margin: 28px auto 18px;
      padding: 19px;
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 8px 24px rgba(91, 78, 57, 0.05);
    }

    .question-panel label {
      display: block;
      margin-bottom: 10px;
      color: #857456;
      font-size: 15px;
      font-weight: 700;
    }

    select {
      width: 100%;
      appearance: none;
      border: 1px solid #d7cfbf;
      border-radius: 10px;
      padding: 13px 42px 13px 14px;
      color: #655d53;
      background:
        linear-gradient(45deg, transparent 50%, #a18859 50%) calc(100% - 18px) 50% / 7px 7px no-repeat,
        linear-gradient(135deg, #a18859 50%, transparent 50%) calc(100% - 12px) 50% / 7px 7px no-repeat,
        #fffdf9;
      font: inherit;
      cursor: pointer;
    }

    select:focus {
      outline: 3px solid rgba(199, 164, 95, 0.25);
      border-color: var(--gold);
    }

    .notice {
      margin: 12px 0 0;
      color: #a09689;
      font-size: 13px;
      line-height: 1.7;
    }

    /* 五子十字盤 */
    .divination-board {
      display: grid;
      grid-template-columns: repeat(3, 76px);
      grid-template-rows: repeat(3, 76px);
      place-items: center;
      justify-content: center;
      gap: 3px;
      margin: 28px auto 8px;
    }

    .slot {
      display: flex;
      width: 76px;
      height: 76px;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .slot-1 {
      grid-column: 2;
      grid-row: 2;
      z-index: 2;
    }

    .slot-2 {
      grid-column: 1;
      grid-row: 2;
    }

    .slot-3 {
      grid-column: 3;
      grid-row: 2;
    }

    .slot-4 {
      grid-column: 2;
      grid-row: 1;
    }

    .slot-5 {
      grid-column: 2;
      grid-row: 3;
    }

    .slot-number {
      position: absolute;
      z-index: 3;
      top: -1px;
      left: 2px;
      width: 19px;
      height: 19px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #fff;
      background: #aa9780;
      font-size: 11px;
      font-weight: 700;
    }

    /*
      五子盤與下方 32 顆棋子均使用 64px，
      確保尺寸完全一致。
    */
    .piece,
    .piece-button {
      width: 64px;
      height: 64px;
      border-radius: 50%;
    }

    .piece {
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #cfc6b8;
      color: #aaa094;
      background:
        radial-gradient(circle at 35% 28%, #fffefb 0%, #ece9e1 58%, #ddd8ce 100%);
      box-shadow:
        inset 0 2px 5px rgba(255, 255, 255, 0.9),
        inset 0 -3px 7px rgba(91, 78, 57, 0.12),
        0 4px 10px var(--shadow);
      font-size: 25px;
      font-weight: 800;
    }

    .piece.empty {
      color: #b7b0a6;
      font-size: 22px;
      font-weight: 400;
    }

    .piece.red {
      color: var(--red);
      border-color: #c98982;
    }

    .piece.black {
      color: var(--black);
      border-color: #90999d;
    }

    .piece.center-piece {
      width: 72px;
      height: 72px;
      border: 4px solid var(--gold);
      outline: 5px solid rgba(234, 217, 172, 0.45);
      font-size: 27px;
    }

    .status {
      min-height: 27px;
      margin: 10px 0 25px;
      text-align: center;
      color: #91877b;
      font-size: 15px;
    }

    .status.complete {
      color: #88703b;
      font-weight: 700;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 22px 0 14px;
      color: #8c7550;
      font-size: 18px;
      font-weight: 700;
    }

    .section-title::before,
    .section-title::after {
      width: 38px;
      height: 1px;
      content: "";
      background: var(--gold-light);
    }

    .palette-wrap {
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.72);
      box-shadow: 0 9px 25px rgba(91, 78, 57, 0.05);
    }

    .piece-palette {
      display: grid;
      grid-template-columns: repeat(8, 64px);
      justify-content: center;
      gap: 14px;
    }

    .piece-button {
      appearance: none;
      display: grid;
      place-items: center;
      border: 2px solid #d4cec2;
      color: #a29a8e;
      background:
        radial-gradient(circle at 35% 28%, #fffefb 0%, #ece9e1 58%, #ddd8ce 100%);
      box-shadow:
        inset 0 2px 5px rgba(255, 255, 255, 0.9),
        inset 0 -3px 7px rgba(91, 78, 57, 0.12),
        0 4px 9px rgba(91, 78, 57, 0.13);
      cursor: pointer;
      font-family: inherit;
      font-size: 25px;
      font-weight: 800;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .piece-button:hover:not(:disabled) {
      transform: translateY(-4px);
      border-color: var(--gold);
      box-shadow:
        inset 0 2px 5px rgba(255, 255, 255, 0.9),
        0 8px 15px rgba(130, 103, 53, 0.22);
    }

    .piece-button:focus-visible {
      outline: 3px solid #d4b36c;
      outline-offset: 3px;
    }

    /* 初始覆蓋棋子的問號 */
    .piece-button.covered::after {
      content: "？";
    }

    .piece-button.revealed {
      cursor: default;
    }

    .piece-button.revealed.red {
      color: var(--red);
      border-color: #c98982;
    }

    .piece-button.revealed.black {
      color: var(--black);
      border-color: #90999d;
    }

    .piece-button:disabled {
      opacity: 0.72;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 28px 0 0;
      flex-wrap: wrap;
    }

    .action-button {
      border: 1px solid #cfc4b2;
      border-radius: 11px;
      padding: 13px 21px;
      color: #766c60;
      background: #fffdf9;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      transition: 0.18s ease;
    }

    .action-button:hover:not(:disabled) {
      transform: translateY(-2px);
      border-color: #ad9362;
    }

    .action-button.primary {
      border-color: #ab8950;
      color: #fffdf8;
      background: linear-gradient(135deg, #cfb06e, #aa8750);
    }

    .action-button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .result {
      display: none;
      width: min(760px, 100%);
      margin: 34px auto 0;
      padding: 27px;
      border: 1px solid #dcc58f;
      border-radius: 18px;
      background:
        linear-gradient(145deg, rgba(235, 216, 170, 0.36), transparent 55%),
        #fffdf9;
      box-shadow: 0 10px 28px rgba(91, 78, 57, 0.08);
    }

    .result.show {
      display: block;
      animation: reveal 0.35s ease;
    }

    .result h2 {
      margin: 0;
      color: #8a7246;
      text-align: center;
      font-size: 22px;
    }

    .result-question {
      margin: 12px 0 18px;
      color: #a18350;
      text-align: center;
      font-size: 15px;
      font-weight: 700;
    }

    .result-pieces {
      margin-bottom: 18px;
      color: #71685d;
      text-align: center;
      font-size: 21px;
      letter-spacing: 0.16em;
      font-weight: 800;
    }

    .result p {
      margin: 11px 0;
      color: #716b63;
      line-height: 1.9;
      font-size: 15px;
    }

    .result strong {
      color: #937744;
    }

    .disclaimer {
      padding-top: 14px;
      border-top: 1px solid #e5ddcf;
      color: #a1988d !important;
      font-size: 13px !important;
    }

    @keyframes reveal {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 690px) {
      .piece-palette {
        grid-template-columns: repeat(6, 64px);
      }
    }

    @media (max-width: 470px) {
      .app {
        width: min(100% - 20px, 980px);
        padding-top: 27px;
      }

      .palette-wrap {
        padding: 14px 8px;
      }

      .piece-palette {
        grid-template-columns: repeat(4, 64px);
        gap: 11px;
      }

      .result {
        padding: 20px;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <header>
      <h1>象棋占卜・五子解惑</h1>
      <p class="subtitle">
        請先選擇問事方向，靜心默念問題後，<br />
        依直覺從覆蓋棋子中選取五顆。
      </p>
    </header>

    <section class="question-panel" aria-label="選擇問事方向">
      <label for="questionType">本次想詢問的方向</label>
      <select id="questionType">
        <option value="">請選擇問事方向</option>
        <option value="annual">流年運勢</option>
        <option value="love">感情發展</option>
        <option value="feelings">對方心意</option>
        <option value="job">工作轉換</option>
        <option value="career">事業方向</option>
        <option value="wealth">財運</option>
        <option value="study">學業考試</option>
        <option value="social">人際關係</option>
        <option value="today">今日運勢</option>
        <option value="action">是否適合行動</option>
      </select>
      <p class="notice">
        卜卦準則：32 顆棋子已隨機洗牌並覆蓋，棋子內容只會於點選當下揭曉。
      </p>
    </section>

    <section aria-label="五子十字卦盤">
      <div class="divination-board" id="divinationBoard"></div>
      <div class="status" id="statusText" aria-live="polite">
        請先選擇問事方向，再選取第 1 顆棋子。
      </div>
    </section>

    <section aria-label="三十二顆覆蓋棋子">
      <div class="section-title">三十二棋子庫</div>
      <div class="palette-wrap">
        <div class="piece-palette" id="piecePalette"></div>
      </div>
    </section>

    <div class="actions">
      <button class="action-button" id="reshuffleButton" type="button">
        重新洗牌
      </button>
      <button class="action-button primary" id="readingButton" type="button" disabled>
        開始個人化解卦
      </button>
    </div>

    <section class="result" id="resultPanel" aria-live="polite">
      <h2>你的五子解卦</h2>
      <div class="result-question" id="resultQuestion"></div>
      <div class="result-pieces" id="resultPieces"></div>
      <p id="resultSummary"></p>
      <p id="resultAdvice"></p>
      <p class="disclaimer">
        此占卜內容僅供自我整理、反思與娛樂參考；健康、法律、財務及重大人生決策，仍請以專業意見與實際條件為準。
      </p>
    </section>
  </main>

  <script>
    "use strict";

    const originalPieces = [
      { label: "帥", side: "red", type: "king" },
      { label: "仕", side: "red", type: "advisor" },
      { label: "仕", side: "red", type: "advisor" },
      { label: "相", side: "red", type: "elephant" },
      { label: "相", side: "red", type: "elephant" },
      { label: "馬", side: "red", type: "horse" },
      { label: "馬", side: "red", type: "horse" },
      { label: "車", side: "red", type: "rook" },
      { label: "車", side: "red", type: "rook" },
      { label: "炮", side: "red", type: "cannon" },
      { label: "炮", side: "red", type: "cannon" },
      { label: "兵", side: "red", type: "pawn" },
      { label: "兵", side: "red", type: "pawn" },
      { label: "兵", side: "red", type: "pawn" },
      { label: "兵", side: "red", type: "pawn" },
      { label: "兵", side: "red", type: "pawn" },

      { label: "將", side: "black", type: "king" },
      { label: "士", side: "black", type: "advisor" },
      { label: "士", side: "black", type: "advisor" },
      { label: "象", side: "black", type: "elephant" },
      { label: "象", side: "black", type: "elephant" },
      { label: "馬", side: "black", type: "horse" },
      { label: "馬", side: "black", type: "horse" },
      { label: "車", side: "black", type: "rook" },
      { label: "車", side: "black", type: "rook" },
      { label: "砲", side: "black", type: "cannon" },
      { label: "砲", side: "black", type: "cannon" },
      { label: "卒", side: "black", type: "pawn" },
      { label: "卒", side: "black", type: "pawn" },
      { label: "卒", side: "black", type: "pawn" },
      { label: "卒", side: "black", type: "pawn" },
      { label: "卒", side: "black", type: "pawn" }
    ];

    const questionData = {
      annual: {
        name: "流年運勢",
        core: "今年的重點不在一次到位，而在於看清真正值得投入的方向。",
        action: "請把年度目標分為「必須守住」與「可以突破」兩類，先穩定根基，再逐步擴張。"
      },
      love: {
        name: "感情發展",
        core: "這段關係的進展，取決於雙方是否願意把真實需求說清楚。",
        action: "不要只用猜測判斷關係走向。選一個適合的時機，用平和而具體的方式表達你的期待與界線。"
      },
      feelings: {
        name: "對方心意",
        core: "對方的心意仍有觀望與衡量的成分，不宜只以單一訊號下定論。",
        action: "與其急著追問答案，不如觀察對方是否持續投入時間、行動及回應；穩定的行為比短暫的熱度更可靠。"
      },
      job: {
        name: "工作轉換",
        core: "轉換工作的關鍵，在於新選擇能否提供更長期的成長空間，而非只避開眼前壓力。",
        action: "建議同時評估職務內容、薪資條件、團隊文化與可累積的能力，保留備案後再做決定。"
      },
      career: {
        name: "事業方向",
        core: "你目前需要的不是盲目增加選項，而是聚焦最能累積專業價值的一條路。",
        action: "挑選一項可在三到六個月內具體驗證的方向，設定里程碑並持續調整，讓行動替你篩選方向。"
      },
      wealth: {
        name: "財運",
        core: "財務能量偏向規劃與累積，穩健管理比追逐快速獲利更有利。",
        action: "先盤點固定支出、儲蓄與風險部位；若有投資或消費決定，請保留緩衝資金並避免情緒性操作。"
      },
      study: {
        name: "學業考試",
        core: "成果與準備節奏高度相關，現在最有效的方法是把壓力轉換為可執行的讀書安排。",
        action: "優先補強最容易失分的題型，採取短時段、反覆練習與錯題整理；規律複習比臨時衝刺更有效。"
      },
      social: {
        name: "人際關係",
        core: "你的人際課題在於分辨哪些關係值得投入，以及如何維持舒服的互動邊界。",
        action: "先真誠回應重要的人，再對消耗性的互動適度留白；清楚而溫和的界線，能讓關係走得更長久。"
      },
      today: {
        name: "今日運勢",
        core: "今天適合依照輕重緩急安排節奏，不必強迫自己同時完成所有事情。",
        action: "先處理一件最關鍵的小事，再回覆重要訊息；留意臨時變動，預留彈性就能減少慌亂。"
      },
      action: {
        name: "是否適合行動",
        core: "是否行動的答案不只在衝勁，而在於你是否已具備足夠資訊與可承擔的後果。",
        action: "若條件尚未明朗，先做低風險測試；若資源、時機與目標已清楚，便可採取明確的下一步。"
      }
    };

    const divinationBoard = document.getElementById("divinationBoard");
    const piecePalette = document.getElementById("piecePalette");
    const questionType = document.getElementById("questionType");
    const statusText = document.getElementById("statusText");
    const reshuffleButton = document.getElementById("reshuffleButton");
    const readingButton = document.getElementById("readingButton");
    const resultPanel = document.getElementById("resultPanel");
    const resultQuestion = document.getElementById("resultQuestion");
    const resultPieces = document.getElementById("resultPieces");
    const resultSummary = document.getElementById("resultSummary");
    const resultAdvice = document.getElementById("resultAdvice");

    let deck = [];
    let selectedPieces = [];

    function randomInt(max) {
      if (window.crypto && window.crypto.getRandomValues) {
        const array = new Uint32Array(1);
        const limit = Math.floor(4294967296 / max) * max;

        do {
          window.crypto.getRandomValues(array);
        } while (array[0] >= limit);

        return array[0] % max;
      }

      return Math.floor(Math.random() * max);
    }

    function shuffle(items) {
      const result = [...items];

      for (let i = result.length - 1; i > 0; i--) {
        const j = randomInt(i + 1);
        [result[i], result[j]] = [result[j], result[i]];
      }

      return result;
    }

    function renderBoard() {
      divinationBoard.innerHTML = "";

      for (let position = 1; position <= 5; position++) {
        const slot = document.createElement("div");
        slot.className = `slot slot-${position}`;

        const number = document.createElement("span");
        number.className = "slot-number";
        number.textContent = position;

        const piece = selectedPieces[position - 1];
        const circle = document.createElement("div");

        if (piece) {
          circle.className = `piece ${piece.side} ${position === 1 ? "center-piece" : ""}`;
          circle.textContent = piece.label;
          circle.setAttribute("title", getPieceName(piece.type));
        } else {
          circle.className = `piece empty ${position === 1 ? "center-piece" : ""}`;
          circle.textContent = "○";
        }

        slot.append(number, circle);
        divinationBoard.appendChild(slot);
      }
    }

    function renderPalette() {
      piecePalette.innerHTML = "";

      deck.forEach((piece, index) => {
        const button = document.createElement("button");

        button.type = "button";
        button.className = "piece-button covered";
        button.dataset.index = index;
        button.setAttribute("aria-label", `覆蓋棋子，第 ${index + 1} 顆`);
        button.addEventListener("click", () => selectPiece(index));

        piecePalette.appendChild(button);
      });
    }

    function selectPiece(index) {
      if (!questionType.value) {
        statusText.textContent = "請先選擇問事方向，再開始選取棋子。";
        return;
      }

      if (selectedPieces.length >= 5) return;

      const button = piecePalette.querySelector(`[data-index="${index}"]`);
      const piece = deck[index];

      if (!button || !piece || button.disabled) return;

      button.classList.remove("covered");
      button.classList.add("revealed", piece.side);
      button.textContent = piece.label;
      button.disabled = true;
      button.setAttribute("aria-label", `已選取：${piece.label}`);

      selectedPieces.push(piece);

      renderBoard();
      updateStatus();

      if (selectedPieces.length === 5) {
        readingButton.disabled = false;
        statusText.textContent = "五顆棋子已依 1 至 5 順序排入卦盤，可以開始個人化解卦。";
        statusText.classList.add("complete");
      }
    }

    function updateStatus() {
      const count = selectedPieces.length;

      if (count < 5) {
        statusText.classList.remove("complete");

        if (!questionType.value) {
          statusText.textContent = "請先選擇問事方向，再選取第 1 顆棋子。";
        } else {
