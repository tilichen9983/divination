<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>象棋占卜｜五子解惑</title>

  <style>
    :root {
      --bg: #15151d;
      --panel: #191a24;
      --panel-deep: #11121a;
      --line: #343543;
      --gold: #d7ad38;
      --gold-dark: #5a4718;
      --text: #ececf2;
      --muted: #a7a7b3;
      --red: #ff6c63;
      --red-line: #7e3e3c;
      --blue: #b7d0ed;
      --blue-line: #35516f;
      --cover: #242532;
      --cover-line: #555665;
      --success: #79cf9a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family:
        "Noto Sans TC", "Microsoft JhengHei", "PingFang TC",
        Arial, sans-serif;
      background:
        radial-gradient(circle at 50% -10%, #28252d 0%, transparent 37%),
        var(--bg);
    }

    .app {
      width: min(980px, calc(100% - 32px));
      margin: 0 auto;
      padding: 42px 0 70px;
    }

    header {
      text-align: center;
      margin-bottom: 28px;
    }

    h1 {
      margin: 0;
      color: var(--gold);
      font-size: clamp(25px, 4vw, 34px);
      letter-spacing: 0.14em;
      font-weight: 800;
    }

    .subtitle {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.8;
    }

    .notice {
      width: min(650px, 100%);
      margin: 22px auto 0;
      padding: 12px 16px;
      color: #d4d4dc;
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid #353541;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.7;
    }

    .notice strong {
      color: var(--gold);
    }

    .draw-board {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 30px auto 20px;
      flex-wrap: wrap;
    }

    .slot {
      width: 84px;
      height: 102px;
      border: 1px solid #414250;
      border-radius: 13px;
      background: var(--panel-deep);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .slot-number {
      position: absolute;
      top: 7px;
      left: 10px;
      color: #7d7e8c;
      font-size: 12px;
    }

    .slot-empty {
      color: #555664;
      font-size: 24px;
      line-height: 1;
    }

    .slot-piece {
      width: 57px;
      height: 57px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 29px;
      font-weight: 800;
      line-height: 1;
      background: #1d1e28;
    }

    .slot-piece.red {
      color: var(--red);
      border: 2px solid var(--red-line);
    }

    .slot-piece.black {
      color: var(--blue);
      border: 2px solid var(--blue-line);
    }

    .slot-name {
      margin-top: 6px;
      color: #c8c8d0;
      font-size: 12px;
    }

    .status {
      min-height: 26px;
      text-align: center;
      color: var(--muted);
      font-size: 15px;
      margin: 5px 0 22px;
    }

    .status.complete {
      color: var(--success);
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 13px;
      margin: 28px 0 12px;
      color: var(--gold);
      font-size: 18px;
      font-weight: 700;
    }

    .section-title::before,
    .section-title::after {
      content: "";
      width: 30px;
      height: 1px;
      background: var(--gold);
      opacity: 0.85;
    }

    .palette-wrap {
      padding: 17px;
      border: 1px solid #3c3d4b;
      border-radius: 24px;
      background: linear-gradient(145deg, #1b1c27, #15161f);
      box-shadow: 0 16px 35px rgba(0, 0, 0, 0.22);
    }

    .piece-palette {
      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      gap: 11px;
    }

    /*
      未翻開前，按鈕內不會寫入任何棋子文字；
      畫面只顯示通用的「？」覆蓋圖樣。
    */
    .piece-btn {
      appearance: none;
      border: 2px solid var(--cover-line);
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      cursor: pointer;
      color: #c5c6d0;
      background:
        radial-gradient(circle at 35% 30%, #363746 0%, #272834 50%, #20212b 100%);
      font-family: inherit;
      font-size: clamp(20px, 3.8vw, 29px);
      font-weight: 800;
      transition: transform 0.18s ease, border-color 0.18s ease, filter 0.18s ease;
      position: relative;
    }

    .piece-btn::after {
      content: "";
      position: absolute;
      inset: 7px;
      border: 1px dashed rgba(216, 217, 226, 0.22);
      border-radius: 50%;
      pointer-events: none;
    }

    .piece-btn:hover:not(:disabled) {
      transform: translateY(-3px) scale(1.035);
      border-color: var(--gold);
      filter: brightness(1.14);
    }

    .piece-btn:focus-visible {
      outline: 3px solid #f1ca62;
      outline-offset: 3px;
    }

    .piece-btn:disabled {
      cursor: default;
    }

    /* 被抽取後才揭示該棋子內容 */
    .piece-btn.revealed {
      background: #1c1d27;
    }

    .piece-btn.revealed::after {
      display: none;
    }

    .piece-btn.revealed.red {
      color: var(--red);
      border-color: var(--red-line);
    }

    .piece-btn.revealed.black {
      color: var(--blue);
      border-color: var(--blue-line);
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
      margin: 27px 0 0;
    }

    button.action-btn {
      border: 1px solid #4a4b59;
      border-radius: 14px;
      padding: 14px 24px;
      color: #d7d7df;
      background: transparent;
      cursor: pointer;
      font-size: 16px;
      font-family: inherit;
      font-weight: 700;
      transition: 0.18s ease;
    }

    button.action-btn:hover {
      transform: translateY(-2px);
      border-color: #777887;
      background: rgba(255, 255, 255, 0.05);
    }

    button.action-btn.primary {
      color: #1c1810;
      border-color: var(--gold-dark);
      background: linear-gradient(135deg, #d7ae3d, #9b7620);
    }

    button.action-btn.primary:hover {
      background: linear-gradient(135deg, #e7c252, #ae8628);
    }

    .result {
      display: none;
      max-width: 760px;
      margin: 32px auto 0;
      padding: 25px;
      border: 1px solid rgba(215, 173, 56, 0.48);
      border-radius: 18px;
      background:
        linear-gradient(145deg, rgba(215, 173, 56, 0.09), transparent 55%),
        #1a1a22;
    }

    .result.show {
      display: block;
      animation: fadeIn 0.38s ease;
    }

    .result h2 {
      margin: 0 0 14px;
      text-align: center;
      color: var(--gold);
      font-size: 21px;
    }

    .result-pieces {
      text-align: center;
      margin: 0 0 18px;
      color: #dedee6;
      letter-spacing: 0.18em;
      font-size: 20px;
      font-weight: 800;
    }

    .result p {
      margin: 10px 0;
      color: #cdced7;
      line-height: 1.9;
      font-size: 15px;
    }

    .result strong {
      color: #f0cf6d;
    }

    .disclaimer {
      margin-top: 18px !important;
      padding-top: 15px;
      border-top: 1px solid #353641;
      color: #8e8f9c !important;
      font-size: 13px !important;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 650px) {
      .app {
        width: min(100% - 22px, 980px);
        padding-top: 30px;
      }

      .piece-palette {
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 9px;
      }

      .palette-wrap {
        padding: 12px;
        border-radius: 18px;
      }

      .slot {
        width: 59px;
        height: 82px;
      }

      .slot-piece {
        width: 43px;
        height: 43px;
        font-size: 23px;
      }

      .slot-name {
        font-size: 10px;
      }
    }

    @media (max-width: 380px) {
      .piece-palette {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <header>
      <h1>象棋占卜・五子解惑</h1>
      <p class="subtitle">
        靜心默念問題後，依序從覆蓋棋子中選取五顆。<br />
        每顆棋子僅會在你選取當下揭曉。
      </p>

      <div class="notice">
        <strong>卜卦規則：</strong>
        32 顆棋子已於本次開始時隨機洗牌並覆蓋，請憑直覺選取，
        不可預先得知棋子內容。
      </div>
    </header>

    <section aria-label="已選取的五顆棋子">
      <div class="draw-board" id="drawBoard"></div>
      <div class="status" id="statusText" aria-live="polite">
        請從下方覆蓋的棋子中選取第 1 顆。
      </div>
    </section>

    <section aria-label="覆蓋棋子庫">
      <div class="section-title">三十二棋子庫（點選揭曉）</div>

      <div class="palette-wrap">
        <div class="piece-palette" id="piecePalette"></div>
      </div>
    </section>

    <div class="actions">
      <button class="action-btn" id="reshuffleBtn" type="button">
        重新洗牌
      </button>
      <button class="action-btn primary" id="readBtn" type="button" disabled>
        開始解盤
      </button>
    </div>

    <section class="result" id="result" aria-live="polite">
      <h2>五子解盤</h2>
      <div class="result-pieces" id="resultPieces"></div>
      <p id="resultTheme"></p>
      <p id="resultAdvice"></p>
      <p class="disclaimer">
        此內容僅供自我反思與娛樂參考；重要的健康、財務、法律或人生決策，仍請依專業意見與實際情況判斷。
      </p>
    </section>
  </main>

  <script>
    "use strict";

    /*
      棋子資訊只存在於 JavaScript 的牌庫中。
      初始 renderPalette() 不將 piece.label 寫入按鈕 DOM，
      因此前端畫面上的 32 顆棋子均維持覆蓋狀態。
    */
    const originalPieces = [
      { label: "帥", side: "red", type: "king" },
      { label: "仕", side: "red", type: "advisor" },
      { label: "仕", side: "red", type: "advisor" },
      { label: "相", side: "red", type: "elephant" },
      { label: "相", side: "red", type: "elephant" },
      { label: "馬", side: "red", type: "horse" },
      { label: "馬", side: "red", type: "horse" },
      { label: "車", side: "red", type: "rook" },
      { label: "車", side: "red", type: "rook" },
      { label: "炮", side: "red", type: "cannon" },
      { label: "炮", side: "red", type: "cannon" },
      { label: "兵", side: "red", type: "pawn" },
      { label: "兵", side: "red", type: "pawn" },
      { label: "兵", side: "red", type: "pawn" },
      { label: "兵", side: "red", type: "pawn" },
      { label: "兵", side: "red", type: "pawn" },

      { label: "將", side: "black", type: "king" },
      { label: "士", side: "black", type: "advisor" },
      { label: "士", side: "black", type: "advisor" },
      { label: "象", side: "black", type: "elephant" },
      { label: "象", side: "black", type: "elephant" },
      { label: "馬", side: "black", type: "horse" },
      { label: "馬", side: "black", type: "horse" },
      { label: "車", side: "black", type: "rook" },
      { label: "車", side: "black", type: "rook" },
      { label: "砲", side: "black", type: "cannon" },
      { label: "砲", side: "black", type: "cannon" },
      { label: "卒", side: "black", type: "pawn" },
      { label: "卒", side: "black", type: "pawn" },
      { label: "卒", side: "black", type: "pawn" },
      { label: "卒", side: "black", type: "pawn" },
      { label: "卒", side: "black", type: "pawn" }
    ];

    const drawBoard = document.getElementById("drawBoard");
    const piecePalette = document.getElementById("piecePalette");
    const statusText = document.getElementById("statusText");
    const reshuffleBtn = document.getElementById("reshuffleBtn");
    const readBtn = document.getElementById("readBtn");
    const result = document.getElementById("result");
    const resultPieces = document.getElementById("resultPieces");
    const resultTheme = document.getElementById("resultTheme");
    const resultAdvice = document.getElementById("resultAdvice");

    let deck = [];
    let selectedPieces = [];

    /*
      使用 Web Crypto 產生亂數；
      若瀏覽器環境不支援，才退回 Math.random()。
    */
    function secureRandomInt(max) {
      if (window.crypto && window.crypto.getRandomValues) {
        const limit = Math.floor(0x100000000 / max) * max;
        const randomValue = new Uint32Array(1);

        do {
          window.crypto.getRandomValues(randomValue);
        } while (randomValue[0] >= limit);

        return randomValue[0] % max;
      }

      return Math.floor(Math.random() * max);
    }

    function shuffleDeck(items) {
      const shuffled = [...items];

      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = secureRandomInt(i + 1);
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }

      return shuffled;
    }

    function renderSlots() {
      drawBoard.innerHTML = "";

      for (let i = 0; i < 5; i++) {
        const slot = document.createElement("div");
        slot.className = "slot";

        const number = document.createElement("span");
        number.className = "slot-number";
        number.textContent = i + 1;
        slot.appendChild(number);

        if (selectedPieces[i]) {
          const piece = selectedPieces[i];

          const pieceCircle = document.createElement("div");
          pieceCircle.className = `slot-piece ${piece.side}`;
          pieceCircle.textContent = piece.label;

          const pieceName = document.createElement("div");
          pieceName.className = "slot-name";
          pieceName.textContent = getPieceMeaning(piece.type);

          slot.appendChild(pieceCircle);
          slot.appendChild(pieceName);
        } else {
          const empty = document.createElement("div");
          empty.className = "slot-empty";
          empty.textContent = "○";
          slot.appendChild(empty);
        }

        drawBoard.appendChild(slot);
      }
    }

    function renderPalette() {
      piecePalette.innerHTML = "";

      deck.forEach((piece, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "piece-btn";
        button.dataset.index = index;

        /*
          關鍵：初始僅顯示問號，不放入任何棋子 label。
        */
        button.textContent = "？";
        button.setAttribute("aria-label", `覆蓋棋子，第 ${index + 1} 顆`);

        button.addEventListener("click", () => selectPiece(index));
        piecePalette.appendChild(button);
      });
    }

    function selectPiece(index) {
      if (selectedPieces.length >= 5) return;

      const piece = deck[index];
      const button = piecePalette.querySelector(`[data-index="${index}"]`);

      if (!piece || !button || button.disabled) return;

      /*
        點選當下才將真正棋子文字寫入按鈕並揭示。
      */
      button.textContent = piece.label;
      button.classList.add("revealed", piece.side);
      button.disabled = true;
      button.setAttribute("aria-label", `已揭曉：${piece.label}`);

      selectedPieces.push(piece);
      renderSlots();
      updateStatus();

      if (selectedPieces.length === 5) {
        readBtn.disabled = false;
        statusText.textContent = "五顆棋子已選定，可以開始解盤。";
        statusText.classList.add("complete");
      }
    }

    function updateStatus() {
      const count = selectedPieces.length;

      if (count < 5) {
        statusText.textContent = `請從下方覆蓋的棋子中選取第 ${count + 1} 顆。`;
        statusText.classList.remove("complete");
      }
    }

    function getPieceMeaning(type) {
      const meanings = {
        king: "主心骨",
        advisor: "守護",
        elephant: "根基",
        horse: "轉機",
        rook: "行動",
        cannon: "突破",
        pawn: "累積"
      };

      return meanings[type] || "";
    }

    function buildReading() {
      const typeCount = {};
      let redCount = 0;
      let blackCount = 0;

      selectedPieces.forEach((piece) => {
        typeCount[piece.type] = (typeCount[piece.type] || 0) + 1;

        if (piece.side === "red") {
          redCount++;
        } else {
          blackCount++;
        }
      });

      const hasKing = Boolean(typeCount.king);
      const hasRook = Boolean(typeCount.rook);
      const hasHorse = Boolean(typeCount.horse);
      const hasCannon = Boolean(typeCount.cannon);
      const pawnCount = typeCount.pawn || 0;
      const defenseCount =
        (typeCount.advisor || 0) + (typeCount.elephant || 0);

      let theme = "";
      let advice = "";

      if (hasKing) {
        theme += "此局核心在於<strong>重新確立主導權與優先順序</strong>。";
      } else {
        theme += "此局顯示事情正處於<strong>調整布局、逐步成形</strong>的階段。";
      }

      if (hasRook) {
        theme += "「車」入局，表示局勢需要明確推進，拖延反而容易錯失時機。";
      } else if (hasHorse) {
        theme += "「馬」入局，暗示轉機常來自不同角度、人物或路徑。";
      } else if (hasCannon) {
        theme += "「炮」入局，提醒你善用距離、資源與時機，勿急於正面衝撞。";
      } else {
        theme += "目前更適合穩住步調，先看清局面再決定下一步。";
      }

      if (pawnCount >= 2) {
        advice += "卦象偏向<strong>積小成大</strong>：把大問題拆成可執行的小步驟，持續累積比一次求成更有力量。";
      } else if (defenseCount >= 2) {
        advice += "卦象提醒你先<strong>守住根基與界線</strong>。先確認資源、承諾與風險，再選擇前進方向。";
      } else if (hasCannon && hasHorse) {
        advice += "宜採取<strong>靈活但有策略的行動</strong>。保留備案，先試探、後加碼，能減少不必要的阻力。";
      } else if (hasRook) {
        advice += "適合訂出一個明確期限，完成最關鍵的一項行動。只要方向清楚，局勢便能開始推進。";
      } else {
        advice += "建議先整理內在真正的需求，再與可信任的人交換看法；答案會在穩定後逐漸浮現。";
      }

      if (redCount === blackCount) {
        advice += " 五子紅黑均衡，也表示此事宜兼顧主動與耐心，不必急著偏向任何一端。";
      } else if (redCount > blackCount) {
        advice += " 紅方較多，行動意志較強；留意熱情之外，也要預留檢查與修正的空間。";
      } else {
        advice += " 黑方較多，觀察與沉澱的力量較明顯；時機成熟時，記得把想法化為具體行動。";
      }

      resultPieces.textContent = selectedPieces.map((piece) => piece.label).join("　");
      resultTheme.innerHTML = `<strong>局勢提示：</strong>${theme}`;
      resultAdvice.innerHTML = `<strong>行動建議：</strong>${advice}`;
    }

    function showReading() {
      if (selectedPieces.length !== 5) {
        alert("請先選滿五顆棋子，再開始解盤。");
        return;
      }

      buildReading();
      result.classList.add("show");
      result.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function resetDivination() {
      deck = shuffleDeck(originalPieces);
      selectedPieces = [];

      renderSlots();
      renderPalette();

      readBtn.disabled = true;
      result.classList.remove("show");

      statusText.textContent = "棋子已重新洗牌並覆蓋，請從第 1 顆開始選取。";
      statusText.classList.remove("complete");
    }

    reshuffleBtn.addEventListener("click", resetDivination);
    readBtn.addEventListener("click", showReading);

    resetDivination();
  </script>
</body>
</html>
