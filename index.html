<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>象棋卜卦 | 五子解惑 · 命運解碼室</title>
<style>
  :root{
    --gold:#c9a86a;
    --red:#8b1e1e;
    --black:#1a1a1a;
    --bg-dark:#0f0f14;
    --panel:#1c1c24;
    --silver:#c0c0c8;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:"Noto Serif TC","PMingLiU",serif;
    background:linear-gradient(160deg,#0f0f14,#1a1a24);
    color:#eae6da;
    min-height:100vh;
  }
  .container{max-width:1200px;margin:0 auto;padding:16px;}

  /* ---------- 導覽列 ---------- */
  nav{
    display:flex;justify-content:center;gap:24px;
    padding:16px;background:rgba(0,0,0,0.3);
    position:sticky;top:0;z-index:50;backdrop-filter:blur(6px);
  }
  nav button{
    background:none;border:1px solid var(--gold);color:var(--gold);
    padding:8px 20px;border-radius:20px;cursor:pointer;font-size:15px;
    transition:.3s;
  }
  nav button.active,nav button:hover{background:var(--gold);color:#1a1a1a;}

  .page{display:none;animation:fadeIn .5s ease;}
  .page.active{display:block;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

  /* ---------- 引言區 ---------- */
  .intro{
    text-align:center;padding:40px 16px;
  }
  .intro h1{font-size:clamp(22px,4vw,34px);color:var(--gold);letter-spacing:4px;}
  .intro p.quote{
    font-style:italic;color:#bbb;max-width:600px;margin:16px auto;
    font-size:clamp(14px,2vw,17px);line-height:1.8;
  }
  .intro .tags{
    display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:20px;
  }
  .intro .tags span{
    border:1px solid var(--silver);padding:6px 14px;border-radius:16px;font-size:13px;color:var(--silver);
  }

  /* ---------- 棋盤十字佈局 ---------- */
  .board-wrap{display:flex;flex-direction:column;align-items:center;gap:30px;}
  .cross-board{
    display:grid;
    grid-template-columns:repeat(3,minmax(70px,100px));
    grid-template-rows:repeat(3,minmax(70px,100px));
    gap:10px;place-items:center;
  }
  .slot{
    width:100%;height:100%;border:2px dashed var(--gold);
    border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:clamp(20px,3vw,30px);font-weight:bold;position:relative;background:rgba(201,168,106,0.05);
  }
  .slot.filled{border-style:solid;}
  .slot.center{border:3px solid var(--red);box-shadow:0 0 16px rgba(139,30,30,.6);}
  .pos-label{
    position:absolute;top:-18px;font-size:11px;color:#999;
  }
  .p4{grid-column:2;grid-row:1;}
  .p2{grid-column:1;grid-row:2;}
  .p1{grid-column:2;grid-row:2;}
  .p3{grid-column:3;grid-row:2;}
  .p5{grid-column:2;grid-row:3;}

  .piece-face{
    width:90%;height:90%;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:inherit;
  }
  .piece-face.red{background:radial-gradient(circle at 30% 30%,#d94b4b,#7a1414);color:#fff2e0;}
  .piece-face.black{background:radial-gradient(circle at 30% 30%,#444,#0a0a0a);color:#f0e6d2;}

  /* ---------- 32顆覆蓋棋子選取區 ---------- */
  .pool{
    display:grid;grid-template-columns:repeat(8,1fr);gap:10px;
    max-width:720px;width:100%;margin:0 auto;
  }
  @media(max-width:600px){.pool{grid-template-columns:repeat(4,1fr);}}

  .pool-piece{
    aspect-ratio:1/1;border-radius:50%;cursor:pointer;
    background:radial-gradient(circle at 35% 30%,#e8e2c8,#9c9372 60%,#6b6450);
    box-shadow:inset 0 2px 4px rgba(255,255,255,.5),0 3px 6px rgba(0,0,0,.5);
    display:flex;align-items:center;justify-content:center;
    font-size:20px;color:#55503d;transition:.25s;position:relative;
  }
  .pool-piece:hover{transform:translateY(-4px) scale(1.05);}
  .pool-piece.picked{opacity:0.25;pointer-events:none;transform:scale(.85);}
  .pool-piece .order-badge{
    position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;
    width:20px;height:20px;border-radius:50%;font-size:11px;display:flex;align-items:center;justify-content:center;
  }

  /* ---------- 擲筊區 ---------- */
  .jiao-section{text-align:center;padding:30px 16px;display:none;}
  .jiao-section.show{display:block;}
  .jiao-pair{display:flex;justify-content:center;gap:30px;margin:30px 0;}
  .jiao{
    width:80px;height:50px;border-radius:40px;position:relative;
    transition:transform .6s ease;transform-style:preserve-3d;
  }
  .jiao.yang{ /* 平面陽 */
    background:linear-gradient(145deg,#c0392b,#7a1f1f);
    box-shadow:4px 4px 10px rgba(0,0,0,.6), inset -4px -4px 8px rgba(139,30,30,.9);
    border:2px solid #4d1212;
  }
  .jiao.yin{ /* 凸面陰 */
    background:radial-gradient(circle at 40% 30%,#3a2a1a,#1a1008);
    box-shadow:0 6px 14px rgba(0,0,0,.7);
    border-radius:50%;
    border:2px solid #0d0a05;
  }
  .jiao.rolling{animation:roll .8s linear infinite;}
  @keyframes roll{
    0%{transform:rotateX(0deg) rotateY(0deg);}
    100%{transform:rotateX(360deg) rotateY(180deg);}
  }

  .lamp-row{display:flex;justify-content:center;gap:20px;margin:20px 0;}
  .lamp{
    width:36px;height:50px;border-radius:50% 50% 45% 45%;
    background:#333;border:2px solid #555;transition:.4s;
  }
  .lamp.lit{
    background:radial-gradient(circle,#fff6c8,#ffd700 60%,#b8860b);
    box-shadow:0 0 20px 6px gold;
  }

  .result-text{
    font-size:16px;margin:14px 0;padding:14px;border-radius:10px;
  }
  .result-text.sheng{color:#4fd0e0;background:rgba(79,208,224,.08);}
  .result-text.xiao{color:#ff9f43;background:rgba(255,159,67,.08);}
  .result-text.yin{color:#ff5e5e;background:rgba(255,94,94,.08);}

  .btn{
    background:linear-gradient(135deg,var(--gold),#a9843f);
    border:none;color:#1a1a1a;padding:10px 26px;border-radius:24px;
    cursor:pointer;font-size:15px;margin:6px;font-weight:bold;
  }
  .btn.ghost{background:none;border:1px solid var(--silver);color:var(--silver);}

  .golden-flash{
    animation:flash 1.4s ease;
  }
  @keyframes flash{
    0%{box-shadow:0 0 0 rgba(255,215,0,0);}
    40%{box-shadow:0 0 60px 20px rgba(255,215,0,.8);}
    100%{box-shadow:0 0 0 rgba(255,215,0,0);}
  }

  /* ---------- 格局解析卡片 ---------- */
  .analysis-card{
    background:var(--panel);border:1px solid #333;border-radius:14px;
    padding:20px;margin:14px 0;text-align:left;
  }
  .analysis-card h3{color:var(--gold);margin-bottom:8px;font-size:18px;}
  .analysis-card ul{margin-left:18px;color:#ddd;line-height:1.7;font-size:14px;}

  /* ---------- 命運解碼室：32全盤 ---------- */
  .full-board{
    display:grid;grid-template-columns:repeat(8,minmax(32px,60px));
    grid-template-rows:repeat(4,minmax(32px,60px));
    gap:6px;justify-content:center;margin:20px auto;max-width:600px;
  }
  .full-slot{
    border:1px solid #555;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:clamp(12px,2vw,18px);cursor:pointer;background:rgba(255,255,255,.03);
  }
  .timeline{
    display:flex;overflow-x:auto;gap:10px;padding:14px 0;
  }
  .decade-block{
    flex:0 0 100px;background:var(--panel);border-radius:10px;padding:10px;text-align:center;
    border-top:4px solid var(--gold);cursor:pointer;
  }
  .decade-block.locked{opacity:.4;}

  footer{text-align:center;padding:20px;color:#666;font-size:12px;}

  @media(max-width:768px){
    .cross-board{grid-template-columns:repeat(3,70px);grid-template-rows:repeat(3,70px);}
    .jiao{width:60px;height:38px;}
  }
</style>
</head>
<body>

<nav>
  <button class="active" onclick="switchPage('divine')">象棋占卜 · 五子解惑</button>
  <button onclick="switchPage('destiny')">命運解碼室 · 三十二全盤</button>
</nav>

<!-- ========== 功能一：象棋占卜 ========== -->
<div id="page-divine" class="page active">
  <div class="container">

    <div class="intro">
      <h1>棋 落 無 聲 · 心 有 所 問</h1>
      <p class="quote">「一子落定，紅黑交錯間，映照的不過是此刻心中早已知曉的答案。」</p>
      <div class="tags">
        <span>單點解惑</span>
        <span>當下抉擇</span>
        <span>免八字翻棋</span>
      </div>
    </div>

    <div class="board-wrap">
      <div class="cross-board" id="crossBoard">
        <div class="slot p4" data-pos="4"><span class="pos-label">4</span></div>
        <div class="slot p2" data-pos="2"><span class="pos-label">2</span></div>
        <div class="slot p1 center" data-pos="1"><span class="pos-label">1</span></div>
        <div class="slot p3" data-pos="3"><span class="pos-label">3</span></div>
        <div class="slot p5" data-pos="5"><span class="pos-label">5</span></div>
      </div>

      <p id="pickHint" style="color:#aaa;">請憑直覺點選 5 顆棋子，依序填入位置 1～5</p>

      <div class="pool" id="pool"></div>
    </div>

    <!-- 擲筊區 -->
    <div class="jiao-section" id="jiaoSection">
      <h2 style="color:var(--gold);">擲筊請示指導靈</h2>
      <p>請問指導靈，此卦象是否是您最想給我的解答？</p>

      <div class="lamp-row">
        <div class="lamp" id="lamp1"></div>
        <div class="lamp" id="lamp2"></div>
        <div class="lamp" id="lamp3"></div>
      </div>

      <div class="jiao-pair">
        <div class="jiao" id="jiaoLeft"></div>
        <div class="jiao" id="jiaoRight"></div>
      </div>

      <div id="jiaoResult"></div>

      <button class="btn" onclick="castJiao()">擲 筊</button>
      <div id="jiaoActions" style="display:none;">
        <button class="btn" onclick="castJiao()">繼續擲筊</button>
        <button class="btn ghost" onclick="resetFive()">重新抽五顆棋</button>
      </div>
    </div>

    <!-- 最終解析結果 -->
    <div id="finalAnalysis"></div>
  </div>
</div>

<!-- ========== 功能二：命運解碼室 ========== -->
<div id="page-destiny" class="page">
  <div class="container">
    <div class="intro">
      <h1>命 運 解 碼 室</h1>
      <p class="quote">三十二子落定終身格局，一生僅排一次，請謹慎落子。</p>
    </div>

    <div id="destinyLockMsg" style="text-align:center;color:#ff9f43;display:none;">
      您已完成命盤排定，每人僅限建立一次，以下為您的命盤記錄：
    </div>

    <div class="full-board" id="fullBoard"></div>

    <div style="text-align:center;">
      <button class="btn" id="lockBoardBtn" onclick="lockDestinyBoard()">完成排盤並永久鎖定</button>
    </div>

    <h3 style="color:var(--gold);text-align:center;margin-top:30px;">十年運時間軸</h3>
    <div class="timeline" id="timeline"></div>

    <div id="destinyAnalysis"></div>
  </div>
</div>

<footer>象棋卜卦 © 命理邏輯引擎 Demo</footer>
