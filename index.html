<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>象棋占卜｜五子解惑・命運解碼室</title>

  <style>
    :root {
      --bg: #0d0d12;
      --card: #16161f;
      --card-dark: #111119;
      --gold: #d4af37;
      --gold-dark: #8d711b;
      --gold-line: #5b4d25;
      --red: #f33f50;
      --red-piece: #ff705f;
      --black-piece: #a8c7e5;
      --text: #e8e6e3;
      --muted: #9c99a1;
      --line: #2f2f3c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 26px 16px 60px;
      color: var(--text);
      background:
        radial-gradient(circle at top, rgba(212, 175, 55, 0.08), transparent 30%),
        var(--bg);
      font-family: "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif;
    }

    button {
      font-family: inherit;
    }

    .app {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
    }

    /* 頂部模式切換 */
    .mode-tabs {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
      margin-bottom: 24px;
    }

    .mode-tab {
      appearance: none;
      border: 1px solid var(--gold-dark);
      border-radius: 999px;
      padding: 14px 25px;
      color: var(--gold);
      background: transparent;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .mode-tab:hover {
      background: rgba(212, 175, 55, 0.1);
    }

    .mode-tab.active {
      color: #1c1504;
      border-color: transparent;
      background: linear-gradient(135deg, #d3ae2c, #8f701a);
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.32);
    }

    /* 面板 */
    .panel {
      display: none;
      padding: 30px 20px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: rgba(22, 22, 31, 0.98);
      box-shadow: 0 16px 50px rgba(0, 0, 0, 0.25);
    }

    .panel.active {
      display: block;
    }

    /* 五子模式分類按鈕 */
    .sub-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-bottom: 26px;
    }

    .sub-btn {
      padding: 10px 17px;
      border: 1px solid #3b3b4b;
      border-radius: 999px;
      color: var(--muted);
      background: #1c1c27;
      cursor: pointer;
      font-size: 14px;
      transition: 0.2s ease;
    }

    .sub-btn:hover,
    .sub-btn.active {
      color: var(--gold);
      border-color: var(--gold-dark);
      background: rgba(212, 175, 55, 0.1);
    }

    /* 五子棋盤 */
    .five-board {
      position: relative;
      width: 290px;
      height: 290px;
      margin: 4px auto 25px;
    }

    .slot {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 76px;
      height: 76px;
      border: 2px dashed var(--gold-line);
      border-radius: 50%;
      background: #101017;
      font-size: 31px;
      font-weight: 800;
      transition: 0.2s ease;
    }

    .slot.filled {
      border-style: solid;
      border-color: var(--gold-dark);
      box-shadow: 0 0 16px rgba(212, 175, 55, 0.16);
    }

    .slot.center {
      border: 4px solid var(--red);
      box-shadow: 0 0 22px rgba(243, 63, 80, 0.4);
    }

    .slot-number {
      position: absolute;
      top: -22px;
      left: 50%;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
      transform: translateX(-50%);
    }

    .slot[data-pos="1"] {
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .slot[data-pos="2"] {
      top: 50%;
      left: 0;
      transform: translateY(-50%);
    }

    .slot[data-pos="3"] {
      top: 50%;
      right: 0;
      transform: translateY(-50%);
    }

    .slot[data-pos="4"] {
      top: 0;
      left: 50%;
      transform: translateX(-50%);
    }

    .slot[data-pos="5"] {
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
    }

    .hint {
      margin: 0 0 16px;
      color: var(--muted);
      text-align: center;
      line-height: 1.7;
      font-size: 14px;
    }

    .palette-title {
      margin: 14px 0 12px;
      color: var(--gold);
      text-align: center;
      font-size: 14px;
      letter-spacing: 1px;
    }

    /*
      重要修正：
      棋子按鈕直接存在 HTML，不需要等待 JavaScript render。
      因此畫面一定會顯示 32 顆棋子。
    */
    .piece-palette {
      display: grid;
      grid-template-columns: repeat(8, minmax(38px, 1fr));
      gap: 8px;
      width: 100%;
      max-width: 480px;
      min-height: 220px;
      margin: 0 auto 22px;
      padding: 12px;
      border: 1px solid #292936;
      border-radius: 16px;
      background: #111119;
    }

    .piece-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      aspect-ratio: 1 / 1;
      min-width: 0;
      border: 2px solid #3d3d4a;
      border-radius: 50%;
      color: #ddd;
      background: #1b1b26;
      font-size: clamp(16px, 3.2vw, 22px);
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease, opacity 0.15s ease;
    }

    .piece-btn.red {
      color: var(--red-piece);
      border-color: #663434;
    }

    .piece-btn.black {
      color: var(--black-piece);
      border-color: #30455d;
    }

    .piece-btn:hover:not(:disabled) {
      z-index: 1;
      border-color: var(--gold);
      transform: scale(1.1);
    }

    .piece-btn.selected,
    .piece-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      transform: none;
    }

    .piece-btn.selected {
      border-color: var(--gold);
      background: #362b0d;
    }

    .ctrl-row,
    .board-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    .btn {
      border: none;
      border-radius: 11px;
      padding: 12px 20px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .btn-primary {
      color: #1e1704;
      background: linear-gradient(135deg, #d4af37, #8d6d19);
    }

    .btn-primary:hover:not(:disabled) {
      filter: brightness(1.13);
    }

    .btn-primary:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .btn-ghost {
      border: 1px solid #41414d;
      color: var(--muted);
      background: transparent;
    }

    .btn-ghost:hover {
      color: var(--gold);
      border-color: var(--gold-dark);
    }

    /* 解讀結果 */
    .result-box {
      display: none;
      margin-top: 25px;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--card-dark);
      color: var(--text);
      line-height: 1.8;
      font-size: 14px;
    }

    .result-box.show {
      display: block;
    }

    .result-box h3 {
      margin: 0 0 12px;
      color: var(--gold);
      font-size: 17px;
    }

    .result-box p {
      margin: 0 0 14px;
    }

    .result-meta {
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 12px;
    }

    .notice {
      color: var(--muted);
      font-size: 12px;
    }

    /* 全盤模式 */
    .full-hint {
      margin: 0 0 18px;
      color: var(--muted);
      text-align: center;
      line-height: 1.7;
      font-size: 14px;
    }

    .full-board-wrap {
      overflow-x: auto;
      margin-top: 22px;
      padding: 5px 2px 12px;
    }

    .xiangqi-board {
      display: grid;
      grid-template-columns: repeat(9, 42px);
      grid-template-rows: repeat(10, 42px);
      width: max-content;
      margin: 0 auto;
      border: 2px solid #665124;
      background: #17171f;
    }

    .cell {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      border: 1px solid #343440;
      font-size: 21px;
      font-weight: 800;
      cursor: pointer;
      user-select: none;
    }

    .cell:hover {
      background: rgba(212, 175, 55, 0.08);
    }

    .cell.river {
      background: rgba(58, 76, 108, 0.22);
    }

    .red-p {
      color: var(--red-piece);
    }

    .black-p {
      color: var(--black-piece);
    }

    footer {
      margin-top: 28px;
      color: #5c5960;
      text-align: center;
      font-size: 12px;
    }

    @media (max-width: 480px) {
      body {
        padding: 20px 10px 45px;
      }

      .panel {
        padding: 24px 12px;
        border-radius: 18px;
      }

      .mode-tab {
        padding: 11px 16px;
        font-size: 14px;
      }

      .five-board {
        width: 250px;
        height: 250px;
      }

      .slot {
        width: 64px;
        height: 64px;
        font-size: 27px;
      }

      .piece-palette {
        gap: 6px;
        padding: 9px;
      }

      .xiangqi-board {
        grid-template-columns: repeat(9, 34px);
        grid-template-rows: repeat(10, 34px);
      }

      .cell {
        width: 34px;
        height: 34px;
        font-size: 17px;
      }
    }
  </style>
</head>

<body>
  <main class="app">

    <nav class="mode-tabs" aria-label="功能模式">
      <button type="button" class="mode-tab active" data-mode="five">
        象棋占卜・五子解惑
      </button>
      <button type="button" class="mode-tab" data-mode="full">
        命運解碼室・三十二全盤
      </button>
    </nav>

    <!-- 五子解惑 -->
    <section id="panel-five" class="panel active">
      <div class="sub-actions">
        <button type="button" class="sub-btn active" data-type="single">單點解惑</button>
        <button type="button" class="sub-btn" data-type="choice">當下抉擇</button>
        <button type="button" class="sub-btn" data-type="free">免八字翻棋</button>
      </div>

      <div class="five-board" aria-label="五子占卜位置">
        <div class="slot center" data-pos="1">
          <span class="slot-number">1</span>
          <span class="piece-char"></span>
        </div>
        <div class="slot" data-pos="2">
          <span class="slot-number">2</span>
          <span class="piece-char"></span>
        </div>
        <div class="slot" data-pos="3">
          <span class="slot-number">3</span>
          <span class="piece-char"></span>
        </div>
        <div class="slot" data-pos="4">
          <span class="slot-number">4</span>
          <span class="piece-char"></span>
        </div>
        <div class="slot" data-pos="5">
          <span class="slot-number">5</span>
          <span class="piece-char"></span>
        </div>
      </div>

      <p id="fiveHint" class="hint">
        請憑直覺依序點選下方 5 顆棋子，填入位置 1～5。
      </p>

      <div class="palette-title">— 三十二棋子庫（點選加入）—</div>

      <!--
        重要：32 顆棋子固定寫在 HTML。
        即使 JavaScript 未執行，也不會發生棋子庫空白的問題。
      -->
      <div id="piecePalette" class="piece-palette" aria-label="三十二棋子庫">

        <!-- 紅方 16 子 -->
        <button type="button" class="piece-btn red" data-piece-id="r-king" data-name="帥" data-color="red" title="紅帥">帥</button>
        <button type="button" class="piece-btn red" data-piece-id="r-advisor-1" data-name="仕" data-color="red" title="紅仕">仕</button>
        <button type="button" class="piece-btn red" data-piece-id="r-advisor-2" data-name="仕" data-color="red" title="紅仕">仕</button>
        <button type="button" class="piece-btn red" data-piece-id="r-elephant-1" data-name="相" data-color="red" title="紅相">相</button>
        <button type="button" class="piece-btn red" data-piece-id="r-elephant-2" data-name="相" data-color="red" title="紅相">相</button>
        <button type="button" class="piece-btn red" data-piece-id="r-horse-1" data-name="馬" data-color="red" title="紅馬">馬</button>
        <button type="button" class="piece-btn red" data-piece-id="r-horse-2" data-name="馬" data-color="red" title="紅馬">馬</button>
        <button type="button" class="piece-btn red" data-piece-id="r-rook-1" data-name="車" data-color="red" title="紅車">車</button>
        <button type="button" class="piece-btn red" data-piece-id="r-rook-2" data-name="車" data-color="red" title="紅車">車</button>
        <button type="button" class="piece-btn red" data-piece-id="r-cannon-1" data-name="炮" data-color="red" title="紅炮">炮</button>
        <button type="button" class="piece-btn red" data-piece-id="r-cannon-2" data-name="炮" data-color="red" title="紅炮">炮</button>
        <button type="button" class="piece-btn red" data-piece-id="r-pawn-1" data-name="兵" data-color="red" title="紅兵">兵</button>
        <button type="button" class="piece-btn red" data-piece-id="r-pawn-2" data-name="兵" data-color="red" title="紅兵">兵</button>
        <button type="button" class="piece-btn red" data-piece-id="r-pawn-3" data-name="兵" data-color="red" title="紅兵">兵</button>
        <button type="button" class="piece-btn red" data-piece-id="r-pawn-4" data-name="兵" data-color="red" title="紅兵">兵</button>
        <button type="button" class="piece-btn red" data-piece-id="r-pawn-5" data-name="兵" data-color="red" title="紅兵">兵</button>

        <!-- 黑方 16 子 -->
        <button type="button" class="piece-btn black" data-piece-id="b-king" data-name="將" data-color="black" title="黑將">將</button>
        <button type="button" class="piece-btn black" data-piece-id="b-advisor-1" data-name="士" data-color="black" title="黑士">士</button>
        <button type="button" class="piece-btn black" data-piece-id="b-advisor-2" data-name="士" data-color="black" title="黑士">士</button>
        <button type="button" class="piece-btn black" data-piece-id="b-elephant-1" data-name="象" data-color="black" title="黑象">象</button>
        <button type="button" class="piece-btn black" data-piece-id="b-elephant-2" data-name="象" data-color="black" title="黑象">象</button>
        <button type="button" class="piece-btn black" data-piece-id="b-horse-1" data-name="馬" data-color="black" title="黑馬">馬</button>
        <button type="button" class="piece-btn black" data-piece-id="b-horse-2" data-name="馬" data-color="black" title="黑馬">馬</button>
        <button type="button" class="piece-btn black" data-piece-id="b-rook-1" data-name="車" data-color="black" title="黑車">車</button>
        <button type="button" class="piece-btn black" data-piece-id="b-rook-2" data-name="車" data-color="black" title="黑車">車</button>
        <button type="button" class="piece-btn black" data-piece-id="b-cannon-1" data-name="砲" data-color="black" title="黑砲">砲</button>
        <button type="button" class="piece-btn black" data-piece-id="b-cannon-2" data-name="砲" data-color="black" title="黑砲">砲</button>
        <button type="button" class="piece-btn black" data-piece-id="b-pawn-1" data-name="卒" data-color="black" title="黑卒">卒</button>
        <button type="button" class="piece-btn black" data-piece-id="b-pawn-2" data-name="卒" data-color="black" title="黑卒">卒</button>
        <button type="button" class="piece-btn black" data-piece-id="b-pawn-3" data-name="卒" data-color="black" title="黑卒">卒</button>
        <button type="button" class="piece-btn black" data-piece-id="b-pawn-4" data-name="卒" data-color="black" title="黑卒">卒</button>
        <button type="button" class="piece-btn black" data-piece-id="b-pawn-5" data-name="卒" data-color="black" title="黑卒">卒</button>
      </div>

      <div class="ctrl-row">
        <button type="button" id="btnResetFive" class="btn btn-ghost">清除重選</button>
        <button type="button" id="btnDivine" class="btn btn-primary" disabled>開始解盤</button>
      </div>

      <div id="fiveResult" class="result-box"></div>
    </section>

    <!-- 命運解碼室 -->
    <section id="panel-full" class="panel">
      <p class="full-hint">
        可使用「標準開局」或「隨機散落」產生盤面；點擊個別格子可新增或移除棋子。
      </p>

      <div class="board-actions">
        <button type="button" id="btnInitFull" class="btn btn-ghost">標準開局</button>
        <button type="button" id="btnRandomFull" class="btn btn-ghost">隨機散落</button>
        <button type="button" id="btnClearFull" class="btn btn-ghost">清空棋盤</button>
        <button type="button" id="btnDecodeFull" class="btn btn-primary">全盤解碼</button>
      </div>

      <div class="full-board-wrap">
        <div id="fullBoard" class="xiangqi-board" aria-label="象棋全盤"></div>
      </div>

      <div id="fullResult" class="result-box"></div>
    </section>

    <footer>象棋卜卦・命理邏輯引擎示範｜結果僅供娛樂與自我反思參考</footer>
  </main>

  <script defer>
    "use strict";

    /* =========================
       五子解惑：資料與狀態
    ========================= */

    const selectedPieces = [];
    let currentType = "single";

    const PIECE_MEANING = {
      "帥": "主導、決策權、核心意志與領導力量",
      "將": "內在權威、掌控、壓力與局勢主控權",
      "仕": "輔助、文書、謀略、關係中的支持力量",
      "士": "守護、忠誠、制度、內部協調",
      "相": "資源、穩守、社會連結與長期布局",
      "象": "守成、庇蔭、厚實基礎與保護力量",
      "馬": "行動、轉折、變通、快速推進",
      "車": "執行、衝力、效率、直線突破",
      "炮": "策略、借力、蓄勢與關鍵爆發",
      "砲": "遠攻、計謀、突發變局與間接影響",
      "兵": "累積、起步、前進與基層努力",
      "卒": "務實、承擔、穩步推進與現實考驗"
    };

    const POS_MEANING = {
      1: "中宮：核心動機與當下狀態",
      2: "左輔：支持、過去影響與貴人助力",
      3: "右弼：阻力、外在牽引與未來變化",
      4: "天位：理想、目標與外在機遇",
      5: "地位：根基、現實條件與可能結果"
    };

    function updateFiveSlots() {
      for (let position = 1; position <= 5; position++) {
        const slot = document.querySelector(`.slot[data-pos="${position}"]`);
        const charElement = slot.querySelector(".piece-char");
        const piece = selectedPieces[position - 1];

        if (piece) {
          charElement.textContent = piece.name;
          charElement.style.color = piece.color === "red" ? "#ff705f" : "#a8c7e5";
          slot.classList.add("filled");
        } else {
          charElement.textContent = "";
          charElement.style.color = "";
          slot.classList.remove("filled");
        }
      }
    }

    function updateFiveHint() {
      const hint = document.getElementById("fiveHint");
      const divineButton = document.getElementById("btnDivine");
      const count = selectedPieces.length;

      divineButton.disabled = count !== 5;

      if (count === 0) {
        hint.textContent = "請憑直覺依序點選下方 5 顆棋子，填入位置 1～5。";
      } else if (count < 5) {
        hint.textContent = `目前已選擇 ${count}／5 顆棋子，請繼續選擇。`;
      } else {
        hint.textContent = "五子已就位，可開始解盤，或按「清除重選」重新選擇。";
      }
    }

    function selectPiece(button) {
      if (selectedPieces.length >= 5 || button.disabled) {
        return;
      }

      const piece = {
        id: button.dataset.pieceId,
        name: button.dataset.name,
        color: button.dataset.color
      };

      selectedPieces.push(piece);
      button.disabled = true;
      button.classList.add("selected");

      updateFiveSlots();
      updateFiveHint();
    }

    function resetFive() {
      selectedPieces.length = 0;

      document.querySelectorAll(".piece-btn").forEach((button) => {
        button.disabled = false;
        button.classList.remove("selected");
      });

      updateFiveSlots();
      updateFiveHint();

      const result = document.getElementById("fiveResult");
      result.classList.remove("show");
      result.innerHTML = "";
    }

    function getPositionAdvice(piece, position) {
      if (position === 1 && ["帥", "將"].includes(piece.name)) {
        return "主將居中，代表你的核心意志已有明確方向；宜在關鍵問題上果斷定調。";
      }

      if (position === 1 && ["兵", "卒"].includes(piece.name)) {
