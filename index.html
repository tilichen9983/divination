<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>象棋占卜．命運解碼室</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#0d0d12;
    color:#e8d9b5;
    font-family:"Noto Serif TC","PMingLiU",serif;
    min-height:100vh;
    overflow-x:hidden;
  }

  /* ---------- Nav ---------- */
  .nav {
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    justify-content:center;
    padding:20px 16px;
    background:linear-gradient(180deg,#000 0%, #0d0d12 100%);
  }
  .nav-main {
    padding:10px 22px;
    border-radius:30px;
    cursor:pointer;
    font-size:16px;
    border:1px solid #c9a24b;
    transition:.25s;
  }
  .nav-main.active {
    background:#c9a24b;
    color:#1a1205;
    font-weight:bold;
  }
  .nav-main:not(.active) {
    background:transparent;
    color:#c9a24b;
  }
  .nav-sub {
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
    padding-bottom:10px;
  }
  .nav-sub span {
    padding:6px 16px;
    border-radius:20px;
    border:1px solid #555;
    font-size:13px;
    color:#ccc;
  }

  .page { display:none; padding:20px; max-width:900px; margin:0 auto; }
  .page.active { display:block; }

  h2.section-title {
    text-align:center;
    color:#c9a24b;
    font-size:22px;
    margin:10px 0 30px;
    letter-spacing:2px;
  }

  /* ---------- Cross Board (五子) ---------- */
  .cross-board {
    position:relative;
    width:320px;
    height:320px;
    margin:0 auto 30px;
  }
  .cross-slot {
    position:absolute;
    width:100px;
    height:100px;
    border-radius:50%;
    border:2px dashed #c9a24b88;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:14px;
    color:#c9a24b;
    background:rgba(255,255,255,0.02);
    transition:.3s;
  }
  .cross-slot.center {
    border:2px solid #d94e4e;
    box-shadow:0 0 18px #d94e4eaa;
  }
  .cross-slot.filled {
    border-style:solid;
    background:rgba(201,162,75,0.15);
    box-shadow:0 0 14px #c9a24b88;
  }
  .cross-slot .piece-char {
    font-size:34px;
    color:#f5e6c4;
  }
  .cross-slot .slot-num {
    position:absolute;
    top:-26px;
    font-size:13px;
    color:#999;
  }
  #slot-1 { top:110px; left:110px; }
  #slot-2 { top:110px; left:0px; }
  #slot-3 { top:110px; left:220px; }
  #slot-4 { top:0px; left:110px; }
  #slot-5 { top:220px; left:110px; }

  .hint-text {
    text-align:center;
    color:#bbb;
    margin:10px 0 30px;
    font-size:15px;
  }

  /* ---------- Pool 棋子池 ---------- */
  .pool-wrap {
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:14px;
    max-width:720px;
    margin:0 auto 30px;
    padding:20px;
    background:rgba(255,255,255,0.03);
    border-radius:16px;
    border:1px solid #333;
  }
  .pool-piece {
    width:56px;
    height:56px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #3a2f1c, #16130b 80%);
    border:1px solid #c9a24b;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    color:#c9a24b;
    font-size:13px;
    user-select:none;
    transition:.2s;
    position:relative;
  }
  .pool-piece:hover {
    transform:translateY(-4px);
    box-shadow:0 6px 14px rgba(201,162,75,0.4);
  }
  .pool-piece.used {
    opacity:0.2;
    pointer-events:none;
  }
  .pool-piece::after {
    content:"?";
    font-size:22px;
    color:#8a6d2f;
  }

  .btn-row {
    display:flex;
    justify-content:center;
    gap:16px;
    margin-top:20px;
  }
  .btn {
    padding:10px 26px;
    border-radius:24px;
    border:1px solid #c9a24b;
    background:transparent;
    color:#c9a24b;
    cursor:pointer;
    font-size:15px;
    transition:.2s;
  }
  .btn:hover { background:#c9a24b; color:#1a1205; }
  .btn:disabled {
    opacity:0.3;
    cursor:not-allowed;
  }
  .btn:disabled:hover { background:transparent; color:#c9a24b; }

  /* ---------- 擲筊 Jiao ---------- */
  .jiao-section {
    text-align:center;
    margin:40px auto;
    display:none;
  }
  .jiao-section.active { display:block; }
  .jiao-circle {
    width:120px;
    height:120px;
    margin:20px auto;
    border-radius:50%;
    border:2px solid #c9a24b;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:40px;
    cursor:pointer;
    transition:.3s;
  }
  .jiao-circle.shaking { animation:shake .5s; }
  @keyframes shake {
    0%,100% { transform:rotate(0); }
    25% { transform:rotate(-10deg); }
    75% { transform:rotate(10deg); }
  }
  .jiao-result-list {
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:14px;
    font-size:14px;
    color:#ccc;
  }

  /* ---------- 結果面板 ---------- */
  .result-panel {
    margin-top:30px;
    padding:24px;
    border-radius:16px;
    background:rgba(255,255,255,0.03);
    border:1px solid #333;
    display:none;
  }
  .result-panel.active { display:block; }
  .result-panel h3 {
    color:#c9a24b;
    margin-bottom:12px;
    font-size:18px;
  }
  .result-panel p {
    line-height:1.8;
    color:#ddd;
    font-size:15px;
    margin-bottom:10px;
  }

  /* ---------- 32 全盤 ---------- */
  .full-board {
    display:grid;
    grid-template-columns:repeat(8, 1fr);
    gap:10px;
    max-width:720px;
    margin:0 auto 30px;
  }
  .board-slot {
    aspect-ratio:1/1;
    border-radius:50%;
    border:1px dashed #c9a24b88;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-size:11px;
    color:#c9a24b;
    background:rgba(255,255,255,0.02);
    transition:.2s;
  }
  .board-slot.filled {
    border-style:solid;
    background:rgba(201,162,75,0.15);
  }
  .board-slot .piece-char { font-size:22px; color:#f5e6c4; }

  .lock-warning {
    text-align:center;
    color:#e0905a;
    margin:14px 0;
    font-size:14px;
    display:none;
  }
  .lock-warning.active { display:block; }

  .timeline {
    margin-top:20px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .timeline-item {
    padding:12px 16px;
    border-left:3px solid #c9a24b;
    background:rgba(255,255,255,0.02);
    font-size:14px;
    color:#ddd;
  }

  footer {
    text-align:center;
    color:#555;
    font-size:12px;
    padding:30px 0;
  }

  @media (max-width:480px) {
    .cross-board { width:260px; height:260px; }
    .cross-slot { width:80px; height:80px; }
    #slot-1 { top:90px; left:90px; }
    #slot-2 { top:90px; left:0px; }
    #slot-3 { top:90px; left:180px; }
    #slot-4 { top:0px; left:90px; }
    #slot-5 { top:180px; left:90px; }
    .full-board { grid-template-columns:repeat(6,1fr); }
  }
</style>
</head>

<!-- ============ 頁面一：五子解惑 ============ -->

</section>

<section class="page" id="page-destiny">

/* ===================== 共用工具 ===================== */
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function createPoolPiece(piece, onClick) {
  const el = document.createElement("div");
  el.className = "pool-piece";
  el.dataset.id = piece.id;
  el.title = "？";
  el.addEventListener("click", () => onClick(piece, el));
  return el;
}

/* ===================== 頁面切換 ===================== */
function switchPage(pageName) {
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.querySelectorAll(".nav-main").forEach(n => n.classList.remove("active"));

  const targetPage = document.getElementById(`page-${pageName}`);
  const targetNav = document.querySelector(`.nav-main[data-page="${pageName}"]`);

  if (targetPage) targetPage.classList.add("active");
  if (targetNav) targetNav.classList.add("active");
}

/* ===================== 五子解惑邏輯 ===================== */
const divineState = {
  selected: [],      // 已選的 piece 物件，依序
  poolPieces: shuffle(PIECE_DB),
};

function initDivinePool() {
  const poolWrap = document.getElementById("pool-divine");
  poolWrap.innerHTML = "";
  divineState.poolPieces.forEach(piece => {
    const el = createPoolPiece(piece, handleDivinePick);
    poolWrap.appendChild(el);
  });
}

function handleDivinePick(piece, el) {
  if (divineState.selected.length >= 5) return;
  if (el.classList.contains("used")) return;

  el.classList.add("used");
  divineState.selected.push(piece);

  const idx =
